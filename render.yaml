# Blueprint ЛР8, вариант 16. Один Docker Web Service на бесплатном плане.
services:
  - type: web
    name: nazdratenko-hammer-lr8
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/models/best.onnx
      - key: MODEL_VERSION
        value: yolo26n-hammer-v1.0
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
